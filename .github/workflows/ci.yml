name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: delegatelab-backend
      - uses: actions/checkout@v4
        with:
          repository: delegatelab/delegatelab-engine
          ref: main
          path: delegatelab-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: delegatelab-backend
      - run: npm test
        working-directory: delegatelab-backend
      - run: node replay-testnet.mjs
        working-directory: delegatelab-backend
